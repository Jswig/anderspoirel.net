{{ define "main" }}
<article>
    <h1 class="page-title">{{ .Title }}</h1>
    <p class="page-title-date">
        <time datetime="{{ .PublishDate.Format "2006-01-02" }}">
            <em>{{ .PublishDate.Format "2006-01-02" }}</em>
        </time>
        {{ with .Params.assumed_audience }}
            <span class="post-audience"><em><strong>assumed audience:</strong> {{ . }}</em></span>
        {{ end }}
    </p>
    {{ .Content }}
</article>
{{ end }}
